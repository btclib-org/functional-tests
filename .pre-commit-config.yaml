---
# Skip one or more hooks with the SKIP environment variable:
# $ SKIP=mypy pre-commit run --all-files

# these hooks are the lint gate: the lint workflow runs this very file, so
# what CI enforces is exactly what a local run of this file enforces, with
# no second list of tools and versions to keep in step. What pre-commit.ci
# provides on top of that, and what it is kept for, is the periodic pull
# request bumping the revisions pinned below
ci:
  # a bot committing to a branch is at odds with the rest of this setup,
  # where no workflow token can write and every action is pinned to a
  # commit SHA: a failing hook is fixed by its author
  autofix_prs: false
  # no autoupdate_branch, as dependabot declares no target-branch: the
  # default is the default branch, which is the only branch a change
  # lands on
  autoupdate_commit_msg: "Update the pinned pre-commit hook revisions"
  autoupdate_schedule: weekly
  # mypy and pyroma shell out to uv, which is not installed on
  # pre-commit.ci: the lint workflow covers both. check-sdist is not
  # among them -- --installer=pip and --inject-junk are what let it run
  # there with no isolated environment to build in. uv-lock resolves
  # against the interpreter .python-version names, which pre-commit.ci's
  # image does not carry, and its own environment has no network to
  # fetch one: the hook fails there with a DNS error trying to download
  # it. The lint workflow runs it too, where a network and the right
  # interpreter both exist. actionlint-shellcheck runs past
  # pre-commit.ci's time limit; the lint workflow runs it as well
  skip: [mypy, pyroma, uv-lock, actionlint-shellcheck]

repos:
  # this file checking itself, and the only two hooks here with no
  # environment to install. A `files` or `exclude` pattern that stops
  # matching anything is a hook that has quietly stopped running: the rule
  # is still written down and no longer enforced, which is the one defect
  # a green run cannot report on itself
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  # this file checking itself further, on the two moves `autoupdate` makes
  # that it must not take. A rev naming only a major version follows every
  # future release of that major, which is the one thing a rev is here to
  # prevent -- and a prerelease is not a release.
  #
  # pre-commit says the first half itself -- "appears to be a mutable
  # reference (moving tag / branch) ... not supported" -- on stderr, as a
  # warning, on a run that then exits zero: which is the whole difference
  # this hook makes, and the reason it is worth its lines.
  #
  # A commit SHA stays acceptable, should a hook ever want one: the pattern
  # requires the prerelease marker and its digits to end the value, which
  # forty hex characters do not
  - repo: local
    hooks:
      - id: pinned-rev
        name: every pre-commit rev names a released version
        language: pygrep
        entry: '^ *rev: "?v?([0-9]+|[0-9][0-9.]*(a|b|rc|dev)[0-9]+)"?$'
        files: ^\.pre-commit-config\.yaml$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        # not the default --fix=auto, which normalizes a file to its own
        # most frequent ending: a file entirely in CRLF is consistent by
        # that measure, so it stays, and the LF lines added to it are
        # converted the wrong way. This repository is LF throughout
        args: [--fix=lf]
      - id: check-case-conflict
      # no check-executables-have-shebangs, by check-hooks-apply's own
      # verdict: it selects on types [executable], nothing tracked here
      # carries that bit, and a hook that matches no file is not a guard
      # on the future but a line that reads as a rule while enforcing
      # nothing.
      #
      # its converse is on, and is the reason no source file here opens
      # with "#!/usr/bin/env python3": a shebang is read by the kernel only
      # when the file is exec'd directly, which needs the executable bit
      # the hook above finds on nothing, and every script in the tree is
      # invoked as "python .github/scripts/<name>.py"
      - id: check-shebang-scripts-are-executable
      - id: fix-byte-order-marker
      - id: check-yaml
      - id: check-json
        # `.vscode` is jsonc and not json: VSCode reads a comment in its own
        # settings.json and extensions.json, and what those two files carry
        # besides the settings is the reason for each of them. A json parser
        # rejects the file at the first one, so the exclude is what keeps the
        # reasons in the file they explain. It is not a gap: prettier below
        # is given that directory and fails on what it cannot parse, which
        # is the question this hook asks
        exclude: ^\.vscode/
      - id: pretty-format-json
        name: pretty-format-json (in place fixes)
        args: [--autofix, --indent=4, --no-sort-keys]
        exclude: ^\.vscode/
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: detect-private-key
      - id: debug-statements
      - id: check-docstring-first
      # the hook's default, *_test.py, with neither args nor exclude.
      # What it is for is the one failure mode a test suite cannot report
      # on itself -- a file named so that pytest never collects it is not
      # a red test, it is no test, and the count in the report is the only
      # thing that moves.
      - id: name-tests-test
      - id: check-toml
      - id: check-added-large-files
      # there are none, and a submodule is the one dependency that would
      # not be in uv.lock, not be pinned by dependabot, and not be
      # visible in an sdist
      - id: forbid-submodules
  # the credentials of other systems, which is the half of secret scanning
  # GitHub's free plan does not cover. The lint workflow runs these hooks
  # on every pull request, a fork's included, so this is not only a local
  # gate. Not gitleaks: all of its hook ids invoke it with --staged, so
  # under "pre-commit run --all-files", which is what CI runs, it scans an
  # empty staged set and passes
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets (credentials of other systems)
        # the findings are recorded in .secrets.baseline as already
        # reviewed rather than excluded from the scan: an exclusion makes a
        # file blind for good.
        # CONTRIBUTING.md has the command that regenerates the baseline
        args: [--baseline, .secrets.baseline]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell (prose and comments, in place fixes)
        args: [--builtin, clear, --write-changes]
  # crate-ci/typos re-tags a moving `v1` alias onto the same commit
  # as each release, and `autoupdate` proposes that alias on every run and
  # `pinned-rev` above refuses it on every run, so the pin stays stuck
  # rather than moving. `autoupdate` walks every `repo:` entry except
  # `local` and `meta`, so a local hook is the one shape it cannot reach;
  # `additional_dependencies` below carries the version pin in its place
  - repo: local
    hooks:
      - id: typos
        name: typos
        language: python
        additional_dependencies: [typos==1.49.0]
        entry: typos
        args: [--write-changes, --force-exclude]
        types: [text]
        stages: [pre-commit, pre-merge-commit, pre-push, manual]
  # ahead of markdownlint-cli2 below on purpose: that hook's `--fix`
  # repairs the very seam the third check exists to name, so a hook
  # reading the file after it would find nothing left to report.
  - repo: https://github.com/btclib-org/.github
    rev: 364bebad486493fb00f61edc656318567e0604aa # frozen: v2026.11.2
    hooks:
      - id: check-changelog
        args: [--grandfathered, "0"]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2 (in place fixes)
        args: [--fix]
  # how a link destination is spelled, which markdownlint has no rule for
  # and the documentation build depends on. Section 4 of the
  # organization's standard is the rule; the same hook in every repository
  # of the organization (btclib-org/.github#20), there being no shared
  # hook repository to put it in
  - repo: local
    hooks:
      - id: local-link-prefix
        name: a local markdown link destination begins with ./ or ../
        language: pygrep
        entry: |-
          (?<![`!\[])(?:!?\[(?:[^]]|\]\([^)]*\))*\]\(|^\x20{0,3}\[[^]]+\]:\s*)(?!\.\.?/|#|[A-Za-z][A-Za-z0-9+.-]*:)[^)\s]
        types: [markdown]
      - id: no-hyphen-at-end-of-line
        name: a word is not wrapped at its own hyphen
        language: pygrep
        entry: "[A-Za-z0-9]-$"
        types_or: [markdown, python, rst]
      - id: unquoted-placeholder
        name: a placeholder standing as a whole argument is unquoted
        language: pygrep
        entry: |-
          ^(?![\x20\t]*[A-Za-z_][A-Za-z0-9_.-]*[\x20\t]+=[\x20\t])(?:(?:[^"'\n]|'[^'\n]*')*"<[^<>"'`\n]*>"|(?:[^"'\n]|"[^"\n]*")*'<[^<>"'`\n]*>')
        types: [markdown]
        exclude: ^CHANGELOG\.md$
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.10
    hooks:
      - id: prettier
        name: prettier (yaml and jsonc, in place fixes)
        files: ^(.*\.ya?ml|\.vscode/.*\.json|\.markdownlint\.jsonc)$
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        name: taplo (toml, in place fixes)
        exclude: ^uv\.lock$
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: yamllint (the default rule set, less two)
  - repo: local
    hooks:
      - id: toml-comment-width
        name: toml comment width (80 bytes, an unbroken final token exempt)
        language: pygrep
        entry: '^(?=[ \t]*#).{80}\S*[ \t]'
        files: \.toml$
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-dependabot
      - id: check-readthedocs
      - id: check-github-issue-config
      - id: check-github-issue-forms
  # kjanat/actionlint rather than rhysd/actionlint: upstream does not parse
  # `uses: $/...` (rhysd/actionlint#711; rhysd/actionlint#732, unmerged,
  # implements it), and the fork does (btclib-org/.github#1698). The rev
  # is the sha `pre-commit autoupdate --freeze` writes for the tag its
  # comment names, the annotated tag's own object, so a moved tag cannot
  # change what runs here.
  # The cost: pre-commit.ci's weekly bump keeps this line frozen, writing
  # the new sha with `  # frozen: <tag>`, two spaces before the `#`,
  # which prettier above rewrites to one. The bot's pull request then
  # fails prettier until a commit restores the one-space form. A local
  # `pre-commit autoupdate` without `--freeze` writes the tag name instead
  # and drops the comment.
  # The hook is `language: golang`, so pre-commit builds it with a go
  # toolchain. `actionlint-shellcheck` installs a Go build of shellcheck
  # beside actionlint in the hook's environment: actionlint hands the body
  # of a `run:` step to shellcheck, and without one it validates the yaml
  # around a script and not the script. No workflow has a
  # `shell: python` step, so the pyflakes it also delegates to is not
  # declared.
  - repo: https://github.com/kjanat/actionlint
    rev: 2da2ceb4af2c7ecc48f5b9311d85080c3971b5f0 # frozen: v1.17.0
    hooks:
      - id: actionlint-shellcheck
        name: actionlint (github workflows)
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        args: [--offline, --no-progress, --persona=auditor]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        name: ruff check (in place fixes)
        args: [--fix]
      - id: ruff-format
        name: ruff format (in place fixes)
  # what ruff's D rules do not reach: they ask that a docstring exists, and
  # this asks that the arguments and the return it documents are the ones
  # the signature declares. Scoped to btclib_functional_tests, which is where
  # the contract has to be written down
  - repo: https://github.com/jsh9/pydoclint
    rev: 0.12.0
    hooks:
      - id: pydoclint
        name: pydoclint (arguments and return values)
        args: [--config=pyproject.toml]
        files: ^src/btclib_functional_tests/.*\.py$
  - repo: local
    hooks:
      - id: decoded-subprocess-encoding
        name: a decoded subprocess names its encoding, not text=True
        language: pygrep
        entry: '\b(text|universal_newlines)=True'
        files: \.py$
      - id: reasonless-coverage-pragma
        name: a coverage pragma with no inline reason is refused
        language: pygrep
        entry: '#\s*pragma: no (cover|branch)$'
        types: [python]
      # section 4 of the standard, its bare-sourcery-skip bullet, is the
      # rule. pygrep reads bytes, so \s and \w are ASCII there and \W
      # takes in a non-breaking space; a block scalar with no literal
      # space, as local-link-prefix's, for the same reason
      - id: bare-sourcery-skip
        name: a sourcery skip names rules, and no tag
        language: pygrep
        entry: |-
          #\W*sourcery\W+skip(?!:)|#\W*sourcery\W+skip:[^#]*(?<![\w-])(?:default|refactoring|suggestion|comment)(?![\w-])
        types: [python]
  # not the mirrors-mypy hook: it injects --ignore-missing-imports, which
  # turns an unresolved (or misspelled) import into Any, the opposite of
  # strict, and it type checks in an isolated environment, where the
  # project itself is not installed. This is the very command the lint
  # workflow runs, against the project environment and the real pytest
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, in the project environment)
        entry: >
          uv run --locked --no-default-groups --group lint --group test
          mypy src/btclib_functional_tests tests .github/scripts
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.6
    hooks:
      # keep uv.lock in sync with pyproject.toml
      - id: uv-lock
  # what is tracked and not in the sdist, and what is in the sdist and not
  # tracked, both ways round, against the patterns of
  # [tool.uv.build-backend]. --no-isolation is in the hook's own entry and
  # is what pre-commit.ci requires: an isolated build environment cannot
  # be created there, the interpreter having no ensurepip and the
  # virtualenv app data being read-only. --inject-junk drops a cache
  # directory and an egg-info beside the sources for the length of the
  # run, which is what the exclusions in [tool.uv.build-backend] answer.
  #
  # --installer=pip is what makes the archive the gate compares against
  # git, one [build-system] admits, which is section 12 of
  # btclib-org/.github. Without it check-sdist drives `uv build`, and that
  # is not PEP 517 for this backend: uv builds with the copy bundled in
  # the running uv whatever the environment holds, so what packs the
  # archive is the uv the manifest installs unpinned, and naming the
  # backend below decides nothing. With it check-sdist runs `build
  # --no-isolation`, which reads the environment and refuses one outside
  # `requires`, saying "ERROR Missing dependencies". What that keeps is
  # the environment inside `requires` and not the two specifiers equal: a
  # `requires` widened past the line below leaves it satisfying the wider
  # range and green.
  #
  # `args:` and `additional_dependencies:` each replace the manifest's
  # list rather than adding to it, which is why --inject-junk is written
  # again here; the uv the manifest installs goes with it, and
  # --installer=pip does not ask for one. The specifier is
  # [build-system]'s and has to stay it, as the check group's pyroma
  # bound below is
  - repo: https://github.com/henryiii/check-sdist
    rev: v1.6.0
    hooks:
      - id: check-sdist
        args: [--inject-junk, --installer=pip]
        additional_dependencies: ["uv_build>=0.12.0,<0.14"]
  # nothing here is published -- this rates the source tree only, section
  # 4's condition being a declared backend and not a release. Nothing in
  # test.yml rates a release artifact the way btclib-secp256k1's own
  # check-dist job runs pyroma against a built sdist: this tree builds no
  # dist for a workflow to rate.
  # A local hook with no `rev`, run out of pyproject.toml's `check`
  # group: a hook repository's `rev` would be a second declaration of
  # that dependency, and the one naming a prerelease is what
  # `pinned-rev` above refuses (btclib-org/.github#1199).
  # `language: system` and `uv run --locked` are the form section 4 of the
  # organization's standard gives a local mypy hook, and uv is on the PATH
  # of every hook because the lint gate is started by it.
  # `--only-group check` adds that group to the environment the gate runs
  # from and takes nothing out of it, and installs no project;
  # `--no-build` makes a dependency with no wheel fail rather than
  # compile, as section 4 of the organization's standard says. The
  # `-d --min=10 .` and `always_run` are the upstream hook's own
  # definition, written out because a local hook cannot inherit one.
  #
  # The backend is pyproject.toml's `uv_build` of that group, because
  # pyroma builds this project to read its metadata and its command line
  # has no way to say how. It asks `build` for the metadata without
  # isolation and falls back to an isolated build when that raises, and
  # the isolated build is what needs an index. The non-isolated path
  # imports the backend out of the environment and checks nothing else,
  # so the backend alone is what it takes: it is [build-system]'s own
  # specifier, and has to stay it, for the same reason the check-sdist
  # hook above does
  - repo: local
    hooks:
      - id: pyroma
        name: pyroma (the packaging rating of the source tree)
        language: system
        entry: uv run --locked --no-build --only-group check pyroma
        args: [-d, --min=10, .]
        pass_filenames: false
        always_run: true
